name: Build Extension Bundle

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Build Script
        run: npm run build # Or bash build.sh

      - name: Upload Assembled Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-sidebar-build
          path: dist/ # If the output folder is named differently (e.g., 'build'), change this path

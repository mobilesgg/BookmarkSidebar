name: Build Extension Bundle

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dependencies
        run: npm install

      - name: Run Build Script
        run: npm run build

      - name: Upload Assembled Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-sidebar-build
          path: dist/
